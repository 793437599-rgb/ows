<div class="layui-row user-avatar">
    <h1>{:lang('Basic Information')}</h1>
    <div class="public-user-header center-header-new2">
        {include file="public/_user_basic_information"}
        <div class="layui-col-sm12">
            <div class="steps-card">
                <h3>{:lang('Required Steps')}</h3>
                <div class="step-arrow-box">
                    {foreach name="steps" item="vo"}
                    <a href="{:url('index/user/app_step_info',['app_id'=>$app.id,'sort'=>$vo.sort])}">
                        <div class="step-arrow-wrap {if condition='in_array($vo.id,$step_ok) || in_array($vo.id,$step_error)'} step-arrow-complete {/if}">
                            <div class="step-arrow-left">
                                <div class="arrow-1"></div>
                                <div class="arrow-2"></div>
                            </div>
                            <div class="step-arrow-center">
                                <span class="layui-hide-xs">{if in_array($vo.id,$step_error)}<i class="fa fa-exclamation-circle">{/if}</i>{$vo.sort}. {:lang($vo.step_en)}</span>
                                <span class="layui-hide-sm">{if in_array($vo.id,$step_error)}<i class="fa fa-exclamation-circle">{/if}</i>{$vo.sort}</span>
                            </div>
                            <div class="step-arrow-right">
                                <div class="arrow-1"></div>
                                <div class="arrow-2"></div>
                            </div>
                        </div>
                    </a>
                    {/foreach}
                </div>
            </div>
        </div>
    </div>
