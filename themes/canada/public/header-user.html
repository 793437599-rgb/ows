<script type="text/javascript">
    function getCookie(cname) {
        var name = cname + "=";
        var ca = document.cookie.split(';');
        for(var i=0; i<ca.length; i++)
        {
            var c = ca[i].trim();
            if (c.indexOf(name)==0) return c.substring(name.length,c.length);
        }
        return "";
    }
    var langText = getCookie('think_var')
    switch (langText) {
        case 'en-us':
            langText = 'English'
            break;
        case 'zh-cn':
            langText = '中文'
            break;
        case 'ja-jp':
            langText = '日本語'
            break;
        case 'ko-kr':
            langText = '한국어'
            break;
        case 'ru-ru':
            langText = 'Русский'
            break;
        case 'fr-fa':
            langText = 'Français'
            break;
        default:
            langText = 'English'
    }
    // console.log('langText user', langText)
    $('.placeholder').text(langText);
    $('.selects').on('click', '.placeholder', function (e) {
        var parent = $(this).closest('.select');
        if (!parent.hasClass('is-open')) {
            parent.addClass('is-open');
            $('.select.is-open').not(parent).removeClass('is-open');
        } else {
            parent.removeClass('is-open');
        }
        e.stopPropagation();
    }).on('click', 'dl>dd>li', function (e) {
        e.stopPropagation();
        var langText = $(this).text()
        localStorage.setItem('langText', langText)
        //点击选择语种
        var parent = $(this).closest('.select'),
        lang = $(this).attr('class').substr(0,2);
        parent.removeClass('is-open').find('.placeholder').text($(this).text());
            $.get("{:url('index/Index/lang')}", "lang=" + lang, function () {
            location.reload();
            });
    });
    $('body').on('click', function () {
        $('.select.is-open').removeClass('is-open');
    });
	// moblie nav
	$(function(){
		$('.mobile-bars').on('click',function(){
			if($('.mobile-bars').hasClass('nav-active')){
				$(this).removeClass('nav-active')
				$('.nav-fixed').css({'top':'-100%'})
			}else{
				$(this).addClass('nav-active')
				$('.nav-fixed').css({'top':'1.2rem'})
			}
		})
        var sort = '{$sort|default="0"}';
        if (sort > 0 && sort < 10) {
            $('.step-arrow-box a').eq(sort - 1).children('.step-arrow-wrap').removeClass('step-arrow-complete').addClass('step-arrow-current');
        }
	})
</script>
