<!DOCTYPE html>{__NOLAYOUT__}<html lang="{:lang_code()}"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <link rel="stylesheet" href="/canada/css/font-awesome.css">    <link rel="stylesheet" href="/canada/css/pay.css">    <script src="/canada/js/jquery.min.js"></script>    <title>{:lang('Order successful')}</title></head><body><div class="pay_box">    <div class="pay_cuess">        <div class="pay_title">            <h1>{:lang('Payment Successful')}!</h1>            <h3>{:lang('You have successfully paid to WSE')}!</h3>            <h3>{:lang('We will send an email later')}!</h3>            <br>            <br>            <i class="fa fa-check-circle" aria-hidden="true"></i>        </div>        <div  class="pay_tips">            <p>{:lang('Automatic jump after')} <span class="time">10</span>s <a href="{:url('index/user/orderinfo_sharing')}">{:lang('Electronic Certificate Sharing')}</a></p>        </div>    </div></div></body><script>    $(function () {        let count = 10;        let timing = setInterval(function () {            count--;            $('.time').text(count);            console.log(count);            if (count == 0) {                clearInterval(timing);                location.href = "{:url('index/user/orderinfo_sharing')}";            }        }, 1000);    })</script></html>
