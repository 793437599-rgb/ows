<!DOCTYPE html>
<html>
{__NOLAYOUT__}

<head>
	<meta charset="utf-8" />
	<title>wse</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<link rel="stylesheet" href="/canada/css/font-awesome.min.css" />
    <link rel="stylesheet" href="/static/bootstrap-3.3.7-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/static/js/layui/css/layui.css">
    <link rel="stylesheet" href="/canada/css/header-footer.css">
    <link rel="stylesheet" href="/canada/fonts/iconfont.css">
    <link rel="stylesheet" href="/canada/css/login-new.css">
    <link rel="stylesheet" href="/canada/css/user-new.css" />
	<link rel="stylesheet" href="/canada/css/Underlying-changes.css">
	<link rel="stylesheet" type="text/css" href="/canada/css/user.css" />
	<script src="/static/js/jquery.min.js"></script>
	<script src="/static/js/jquery.flexslider-min.js"></script>
	<script src="/static/js/viewer-jquery.min.js"></script>
	<script src="/static/js/mobile.js"></script>
	<script src="/static/js/layui/layui.js"></script>
	<script src="/canada/js/html.js"></script>
	<style>
		.Ul_flist .btn-disabled {
			background-color: #c9c9c9;
			cursor: not-allowed;
		}
	</style>
</head>
			  
<body>
	{include file="public/header-login" /}
	<div class="Ur_box">
		<form id="reset_pass" method="">
			<h2>{:lang('Verify Email')}</h2> 
			<div class="Ur_reset">
				<div class="Ul_flist ">
					<h3>{:lang('Current Email Address')}:</h3>
					<input type="hidden" name="token" id="token" value="{$token}">
					<input class="email-input input_password"  value="{$email|default=''}" type="text" style="text-transform: none;" lay-verify="mail" name="email" id="mail" placeholder="{:lang('Please enter your e-mail address')}" />
					<button class="code-btn" id="verification"  type="button">Get Verification Code </button>
				</div>
				<div class="Ul_flist ">
					<h3>{:lang('Verification Code')}:</h3>
					<input class="input_password" type="text" style="text-transform: none;"  lay-verify="require" name="code" id="code" placeholder="{:lang('Please enter the verification code accepted by your email address')}" />
				</div>
				<div class="Ul_flist">
					<button class="submit" type="button">{:lang('Submit')}</button>
				</div>
			</div>
		</form>
	</div>
	<script type="text/javascript">
		layui.use(['form', 'layedit', 'laydate'], function () {
			var form = layui.form,
					layer = layui.layer;
			form.verify({
				mail: [/^[0-9A-Za-z][\.-_0-9A-Za-z]*@[0-9A-Za-z]+(\.[0-9A-Za-z]+)+$/, 'Please enter the correct email address']
			});

			$(".submit").click(function () {
				let data = {};
				data.email = $('#mail').val();
				data.code = $('#code').val();
				$.ajax({
					type: "post",
					url: "{:url('index/share/index',['token'=>$token])}",
					data: data,
					success: function (result) {
						if (result.code == 20000) {
							layer.msg(result.msg, {time: 2000}, function () {
								window.location.href = result.data.link;
							});
						} else {
							layer.msg(result.msg, {icon: 2});
						}
					},
				});
				return false
			})

			let falg = true;
			$('#verification').click(function () {
				let email = $('[name="email"]').val();
				let token = $('[name="token"]').val();
				if (!checkEmail(email)) {
					layer.tips("{:lang('Please enter your vaild email')}", $('[name="email"]'), {tips: [3, '#FF5722']});
					return false;
				}
				console.log(falg);
				if (!falg) {
					return;
				}
				let load_index;
				$.ajax({
					url: '{:url("index/share/getMailCode")}',
					type: 'post',
					data: {email: email,token:token},
					dataType: 'json',
					beforeSend: function(){
						load_index = layer.load(0)
						console.log(load_index);
					},
					success: function (res) {
						if (res.code == 20000) {
							let second = 60;
							let that = $('#verification');
							that.removeClass('layui-btn-primary').addClass('btn-disabled');
							var interval = setInterval(function () {
								second--
								falg = false;
								that.text((second) + "s")
								if (second === -1) {
									that.text("{:lang('Resend')}").removeClass('btn-disabled').addClass('layui-btn-primary');
									clearInterval(interval)
									falg = true;
								}
							}, 1000)
						} else {
							layer.msg(res.msg);
						}
					},
					complete:function(){
						layer.close(load_index);
					}
				})
			});
			var checkEmail = function (emailStr) {
				var reg = /^([a-zA-Z0-9_-])+@([a-zA-Z0-9_-])+(.[a-zA-Z0-9_-])+/;
				if (!reg.test(emailStr)) {
					return false;
				}
				return true;
			}
		});
	</script>
	{include file="public/footer-login" /}
</body>

</html>
