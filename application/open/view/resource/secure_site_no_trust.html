<!DOCTYPE html>
<html lang="{:lang_code()}">
{__NOLAYOUT__}
<head>

        .secure h3 {

        }

            display: inline-block;

            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .secure .btn:hover {
            opacity: .8;
        }

            margin: 10px 0;
